<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Ghostty theme previews</title>
<desc id="desc">Illustrative terminal mockups showing Nord, Dracula, Catppuccin Mocha, and Gruvbox Dark color palettes.</desc>
