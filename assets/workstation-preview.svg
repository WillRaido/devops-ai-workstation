<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">DevOps AI Workstation terminal design preview</title>
<desc id="desc">A dark terminal interface with a status rail, tool categories, and an example workstation doctor result.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a1017"/><stop offset="1" stop-color="#111b27"/></linearGradient>
